server {
    listen 8080;
    server_name localhost;
    access_log off;
    client_max_body_size 1m;
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
    }
}
