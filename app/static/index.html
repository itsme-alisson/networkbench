<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NetworkBench</title><link rel="icon" type="image/svg+xml" href="/static/networkbench.svg"><link rel="stylesheet" href="/static/vendor/codemirror/lib/codemirror.css"><link rel="stylesheet" href="/static/style.css"><script defer src="/static/vendor/codemirror/lib/codemirror.js"></script><script defer src="/static/vendor/codemirror/mode/jinja2/jinja2.js"></script><script defer src="/static/vendor/codemirror/mode/javascript/javascript.js"></script><script defer src="/static/vendor/codemirror/mode/yaml/yaml.js"></script><script defer src="/static/vendor/codemirror/mode/xml/xml.js"></script><script defer src="/static/vendor/codemirror/addon/edit/matchbrackets.js"></script><script defer src="/static/vendor/codemirror/addon/display/placeholder.js"></script><script defer src="/static/editors.js"></script><script defer src="/static/filter-info.js"></script><script defer src="/static/app.js"></script></head>
<body>
<header><a class="brand" href="/"><img class="brand-icon" src="/static/networkbench.svg" alt="" width="36" height="36">NetworkBench</a><nav aria-label="Tools"><button data-tool="jinja" aria-pressed="true">Jinja</button><button data-tool="ttp" aria-pressed="false">TTP</button><button data-tool="textfsm" aria-pressed="false">TextFSM</button><button data-tool="xpath" aria-pressed="false">XPath</button><button data-tool="json" aria-pressed="false">JSON</button><button data-tool="json_yaml" aria-pressed="false">JSON ↔ YAML</button></nav><span class="local"><i></i> On your machine</span></header>
<main><div class="toolbar"><div><h1 id="title">Jinja renderer</h1><div class="tool-description"><span id="description">Render JSON/YAML variables. Network filters: ipaddr, ipv4, ipv6, ipmath, ipsubnet and more.</span> <span id="jinja-info" class="filter-info"><button id="filter-info-button" class="info-icon" type="button" aria-label="Installed Jinja filters and modules" aria-expanded="false" aria-controls="filter-info-panel">i</button><span id="filter-info-panel" class="info-panel" role="region" aria-label="Installed Jinja filters and modules" tabindex="0" hidden><span id="filter-info-content" aria-live="polite">Loading installed modules…</span></span></span></div></div><div class="actions"><select id="conversion-direction" aria-label="Conversion direction" hidden><option value="json_to_yaml">JSON → YAML</option><option value="yaml_to_json">YAML → JSON</option></select><select id="examples" aria-label="Examples" disabled><option value="">Examples</option></select><button id="clear">Clear</button></div></div>
<section class="previous-work" aria-label="Previous work for this tool"><label for="saved">Previous work <span id="saved-count">0</span></label><input id="saved-search" type="search" placeholder="Search saved names…" aria-label="Search saved work for this tool"><select id="saved" aria-label="Open previous work"><option value="">No saved work yet</option></select><button id="open-latest" disabled>Open latest</button><button id="reload" aria-label="Refresh saved work">Refresh</button></section>
<div class="workspace"><section class="pane"><div class="pane-heading"><label for="input" id="input-label">Data</label><span id="input-type">JSON / YAML</span></div><textarea id="input" spellcheck="false" maxlength="100000" placeholder="Paste your input data…"></textarea></section><section class="pane" id="template-pane"><div class="pane-heading"><label for="template" id="template-label">Template</label><span id="template-type">JINJA2</span></div><textarea id="template" spellcheck="false" maxlength="100000" placeholder="Enter your template…"></textarea></section><section class="pane result-pane"><div class="pane-heading"><label for="result">Result</label><button id="copy">Copy</button></div><textarea id="result" readonly spellcheck="false" placeholder="Your result appears here as you type."></textarea><div id="render-status" role="status" aria-live="polite">Ready</div></section></div>
<div class="bottom-bar"><span><i></i> Live update <span class="separator">/</span> Processed locally</span><span id="save-status" role="status">Changes are saved automatically</span></div>
<div class="saved-bar"><label for="name">Workspace</label><input id="name" maxlength="120" placeholder="Untitled workspace" aria-label="Workspace name"><button id="new">New</button><button id="delete-workspace" class="danger" disabled>Delete saved</button><button id="cleanup-workspaces" class="danger">Clean up all</button></div><p id="notice" role="status"></p>
</main></body></html>
